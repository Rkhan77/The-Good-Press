# Local Supabase configuration for The Good Press.
# Supabase GitHub integration discovers migrations from this directory.
project_id = "the-good-press"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://127.0.0.1:3000", "https://rkhan77.github.io/The-Good-Press/"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[studio]
enabled = true
port = 54323

[analytics]
enabled = false

# Stripe signs webhook payloads itself, so this endpoint verifies Stripe's signature.
[functions.stripe-webhook]
verify_jwt = false

# These server-to-server functions verify the service-role key themselves.
[functions.queue-notifications]
verify_jwt = false

[functions.notification-worker]
verify_jwt = false

[functions.send-email-test]
verify_jwt = false

# Public bearer link; the unguessable per-reader token authorizes only opt-out.
[functions.unsubscribe]
verify_jwt = false
